[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qubitguard"
version = "0.1.0"
description = "Reproducible CPU-scale neural surface-code decoding laboratory"
readme = "README.md"
license = "MIT"
authors = [{name = "Nazeeh Abdul-Hadi"}]
keywords = ["quantum-error-correction", "surface-code", "machine-learning", "stim", "pymatching"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "scipy>=1.14", "stim>=1.15", "pymatching>=2.3", "torch>=2.6", "matplotlib>=3.9", "fastapi>=0.115", "uvicorn>=0.30", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
report = ["reportlab>=4.4", "pypdf>=6"]

[project.urls]
Homepage = "https://github.com/nazeeh111/QubitGuard"
Repository = "https://github.com/nazeeh111/QubitGuard"
Issues = "https://github.com/nazeeh111/QubitGuard/issues"
Changelog = "https://github.com/nazeeh111/QubitGuard/blob/main/CHANGELOG.md"

[project.scripts]
qubitguard = "qubitguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
